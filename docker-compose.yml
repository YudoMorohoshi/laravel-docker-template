services:
  app:
    build: ./php
    volumes:
      - ./src/laravel:/var/www/src/laravel
      - ./php/000-default.conf:/etc/apache2/sites-enabled/000-default.conf
    ports:
      - 8080:80
    depends_on:
      - db
    networks:
      - my_network
  db:
    image: mysql:8.0
    volumes:
      - db:/var/lib/mysql
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=laravel_app
      - LANG=C.UTF-8
    networks:
      - my_network

volumes:
  db:

networks:
  my_network:
    driver: bridge